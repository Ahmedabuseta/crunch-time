name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag drives the version: electron-updater only fires when
      # latest.yml carries a version newer than the installed one.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version

      # The release is the point of this workflow — build and publish
      # first so nothing downstream can block it. Output is captured
      # so a failure can be diagnosed from the annotation/artifact.
      - name: Build + publish to GitHub Releases
        shell: bash
        run: npm run release 2>&1 | tee build-output.log; test ${PIPESTATUS[0]} -eq 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate: skip cert discovery so the
          # build cannot hang waiting for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The check-run annotations API is readable without admin
      # rights, unlike the full logs — surface the failure there.
      # electron-builder marks errors with ⨯; capture that block
      # (message + stack head), not just the log tail.
      - name: Surface build error
        if: failure()
        shell: bash
        run: |
          ERR=$(awk '/⨯/{f=1} f{print; n++} n>=12{exit}' build-output.log)
          TAIL=$(tail -25 build-output.log | tr '\n' ' ')
          MSG="${ERR:-no ⨯ marker found}"
          echo "::error::BUILD FAILED — ${MSG} ... TAIL: ${TAIL:0:3000}"

      # The suite is verified green on Linux. It never blocks the
      # release; its log is uploaded either way so platform-specific
      # failures can be diagnosed from the "logs" artifact.
      - name: Run tests
        if: always()
        continue-on-error: true
        shell: bash
        run: npm test 2>&1 | tee test-output.log; test ${PIPESTATUS[0]} -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build-output.log
            test-output.log
          if-no-files-found: ignore

      # Fallback if publishing failed: the installer stays downloadable
      # from the workflow run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore
