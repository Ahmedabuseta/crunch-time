name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag drives the version: electron-updater only fires when
      # latest.yml carries a version newer than the installed one.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version

      # Package the installer without publishing — electron-builder's
      # own GitHub publisher fails opaquely ("Cannot cleanup" with an
      # empty message), so publishing is done by the standard release
      # action below instead.
      - name: Build installer
        shell: bash
        run: npm run build && npx electron-builder --publish never 2>&1 | tee build-output.log; test ${PIPESTATUS[0]} -eq 0
        env:
          # No code-signing certificate: skip cert discovery so the
          # build cannot hang waiting for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The check-run annotations API is readable without admin
      # rights, unlike the full logs — surface the failure there.
      - name: Surface build error
        if: failure()
        shell: bash
        run: |
          ERR=$(grep -nE "⨯|HttpError|Error:|failed|Cannot" build-output.log | tail -15 | tr '\n' ' ')
          echo "::error::BUILD FAILED — ${ERR:0:5000}"

      # Create the GitHub release and attach the installer, its
      # blockmap and the electron-updater metadata (latest.yml).
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      # The suite is verified green on Linux. It never blocks the
      # release; its log is uploaded either way so platform-specific
      # failures can be diagnosed from the "logs" artifact.
      - name: Run tests
        if: always()
        continue-on-error: true
        shell: bash
        run: npm test 2>&1 | tee test-output.log; test ${PIPESTATUS[0]} -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build-output.log
            test-output.log
          if-no-files-found: ignore

      # Fallback if publishing failed: the installer stays downloadable
      # from the workflow run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore
